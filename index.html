<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="LUYA 2026-2030 bottom-up forecast with CAC-driven S&M, channel net pricing, working capital and cash bridge. / 自下而上的产品、耗材、渠道、营运资金与现金流模型。" />
    <title>LUYA 5-Year Growth Model / 五年增长模型</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="styles.css?v=v4-gate" />
  </head>
  <body data-lang="zh" data-locked>
    <!-- Soft gate only. The page source is public, so this keeps a forwarded
         link from opening on the first click — it is not access control. -->
    <div class="gate" id="gate">
      <form class="gate-card" id="gateForm" autocomplete="off">
        <p class="gate-eyebrow">LUYA · 2026–2030</p>
        <h1 class="gate-title"><span class="t" data-en="Confidential financial model" data-zh="机密财务模型"></span></h1>
        <p class="gate-body t" data-en="This page contains unit costs, margins, channel terms and funding requirements. Enter the access code to continue, and please do not forward the link." data-zh="本页包含单台成本、毛利、渠道条款与融资需求等信息。请输入访问码继续，并请勿转发本链接。"></p>
        <label class="gate-field">
          <span class="t" data-en="Access code" data-zh="访问码"></span>
          <input id="gateInput" type="password" inputmode="text" autocapitalize="characters" spellcheck="false" data-aria-en="Access code" data-aria-zh="访问码" />
        </label>
        <p class="gate-error" id="gateError" hidden></p>
        <button type="submit" class="gate-submit"><span class="t" data-en="Open model" data-zh="打开模型"></span></button>
        <p class="gate-note t" data-en="A courtesy lock, not a security boundary — treat the contents as confidential regardless." data-zh="这是礼貌性的提示锁，并非安全边界 —— 无论如何请将内容视为机密处理。"></p>
      </form>
    </div>

    <main class="app-shell">
      <header class="topbar">
        <div class="topbar-lead">
          <p class="eyebrow"><span class="t" data-en="LUYA Investor Model" data-zh="LUYA 投资人模型"></span> · 2026–2030</p>
          <h1><span class="t" data-en="5-Year Growth Model" data-zh="五年增长模型"></span></h1>
          <p class="subtitle t" data-en="Bottom-up product, channel, consumables, working-capital and cash model." data-zh="自下而上的产品、渠道、耗材、营运资金与现金流模型。"></p>
          <p class="hint-line"><span class="hint-mark">i</span><span class="t" data-en="Hover or tap any metric marked with a dotted underline to see what it means, how it is calculated and where the number comes from." data-zh="把鼠标移到任何带虚线下划线的指标上，即可看到它的含义、计算口径与数字来源。点击可固定弹窗。"></span></p>
        </div>
        <div class="topbar-controls">
          <div class="segmented lang-control" role="group" data-aria-en="Language" data-aria-zh="语言">
            <button type="button" data-lang-set="zh">中文</button>
            <button type="button" data-lang-set="en">EN</button>
            <button type="button" data-lang-set="both">中 / EN</button>
          </div>
          <div class="segmented scenario-control" role="group" data-aria-en="Forecast scenario" data-aria-zh="预测情景">
            <button type="button" data-scenario="bear"><span class="t" data-en="Bear" data-zh="保守"></span></button>
            <button type="button" data-scenario="base"><span class="t" data-en="Base" data-zh="基准"></span></button>
            <button type="button" data-scenario="bull"><span class="t" data-en="Bull" data-zh="乐观"></span></button>
          </div>
          <div class="action-row">
            <button type="button" class="ghost-button" id="shareButton"><span class="t" data-en="Copy link" data-zh="复制链接"></span></button>
            <button type="button" class="ghost-button" id="exportButton"><span class="t" data-en="Export CSV" data-zh="导出 CSV"></span></button>
            <button type="button" class="ghost-button" id="printButton"><span class="t" data-en="Print / PDF" data-zh="打印 / PDF"></span></button>
          </div>
        </div>
      </header>

      <section class="kpi-grid" aria-label="Executive summary">
        <article class="kpi kpi-validation" data-def="kpi.validation" tabindex="0">
          <span class="t" data-en="2026 · Validation year" data-zh="2026 · 验证年"></span>
          <strong id="kpiValidation">—</strong>
          <small id="kpiValidationNote">—</small>
        </article>
        <article class="kpi kpi-blue" data-def="kpi.rev2027" tabindex="0">
          <span class="t" data-en="2027 revenue" data-zh="2027 营收"></span>
          <strong id="kpi2027Revenue">$0</strong>
          <small id="kpi2027Units">—</small>
        </article>
        <article class="kpi kpi-green" data-def="kpi.rev2030" tabindex="0">
          <span class="t" data-en="2030 revenue" data-zh="2030 营收"></span>
          <strong id="kpi2030Revenue">$0</strong>
          <small id="kpi2030Recurring">—</small>
        </article>
        <article class="kpi kpi-amber" data-def="kpi.trough" tabindex="0">
          <span class="t" data-en="Lowest cash point" data-zh="现金最低点"></span>
          <strong id="kpiTrough">$0</strong>
          <small id="kpiTroughYear">—</small>
        </article>
        <article class="kpi kpi-violet" data-def="kpi.funding" tabindex="0">
          <span class="t" data-en="Peak external funding need" data-zh="最大外部融资需求"></span>
          <strong id="kpiFunding">$0</strong>
          <small id="kpiFundingNote">—</small>
        </article>
        <article class="kpi kpi-coral" data-def="kpi.ltvcac" tabindex="0">
          <span class="t" data-en="Blended LTV / CAC" data-zh="加权 LTV / CAC"></span>
          <strong id="kpiLtvCac">0×</strong>
          <small id="kpiPayback">—</small>
        </article>
      </section>

      <section class="model-layout">
        <aside class="assumptions" aria-label="Model assumptions">
          <div class="panel-title">
            <div>
              <p class="section-kicker t" data-en="Model inputs" data-zh="模型输入"></p>
              <h2 class="t" data-en="Assumptions" data-zh="核心假设"></h2>
            </div>
            <button type="button" class="reset-button" id="resetButton"><span class="t" data-en="Reset" data-zh="重置"></span></button>
          </div>
          <p class="save-note t" data-en="Changes save to this browser automatically. Use “Copy link” to share a scenario." data-zh="修改会自动保存在本浏览器。用「复制链接」把当前情景发给别人。"></p>

          <details open>
            <summary class="t" data-en="Core &amp; cash" data-zh="核心与现金"></summary>
            <label class="field"><span class="t" data-en="TAM households" data-zh="目标家庭数"></span><input id="tam" type="number" min="1000000" step="1000000" /></label>
            <label class="field"><span class="t" data-en="Initial free cash ($)" data-zh="初始自由资金 ($)"></span><input id="startingCash" type="number" min="0" step="100000" /></label>
          </details>

          <details open>
            <summary class="t" data-en="Founder 100 programme" data-zh="Founder 100 计划"></summary>
            <label class="field"><span class="t" data-en="Pre-tooling unit cost (RMB)" data-zh="开模前单台硬件成本 (RMB)"></span><input id="preToolingUnitCostRmb" type="number" min="0" step="1000" /></label>
            <label class="field"><span class="t" data-en="Validation units" data-zh="验证台数"></span><input id="validationUnits" type="number" min="0" step="5" /></label>
            <label class="field"><span class="t" data-en="Logistics etc. (RMB)" data-zh="物流等投入 (RMB)"></span><input id="validationLogisticsRmb" type="number" min="0" step="50000" /></label>
            <label class="field"><span class="t" data-en="Other validation spend (RMB)" data-zh="其他验证投入 (RMB)"></span><input id="validationOtherRmb" type="number" min="0" step="50000" /></label>
            <label class="field"><span class="t" data-en="Units gifted to KOLs" data-zh="赠送 KOL 台数"></span><input id="kolUnits" type="number" min="0" step="5" /></label>
            <label class="field"><span class="t" data-en="KOL promotion fee per unit (RMB)" data-zh="KOL 每台投放费用 (RMB)"></span><input id="kolPromoPerUnitRmb" type="number" min="0" step="1000" /></label>
            <label class="field"><span class="t" data-en="Units sold at list price" data-zh="原价销售台数"></span><input id="paidUnits" type="number" min="0" step="5" /></label>
            <div class="calculated-box"><span class="t" data-en="Founder units · programme spend" data-zh="Founder 台数 · 计划投入"></span><strong id="founderPreview">—</strong></div>
            <div class="calculated-box warn-box"><span class="t" data-en="2026 margin on units sold" data-zh="2026 销售台数毛利"></span><strong id="founderMarginPreview">—</strong></div>
            <p class="input-note t" data-en="Tooling lands after the Founder 100, so every 2026 unit is built in small batches at the cost above — not the mass-production BOM. Validation and KOL hardware are both derived as units × that cost; the KOL fee above is the promotion spend on top of the device." data-zh="开模在 Founder 100 之后，因此 2026 年每台都按上方的小批量成本计，而非量产 BOM。验证台与 KOL 台的硬件成本均按「台数 × 该成本」自动推导；上方 KOL 费用仅为设备之外的投放支出。"></p>
          </details>

          <details open>
            <summary class="t" data-en="Product economics" data-zh="产品经济模型"></summary>
            <div class="mini-grid headings">
              <span class="t" data-en="Product" data-zh="产品"></span>
              <span class="t" data-en="ASP" data-zh="售价"></span>
              <span class="t" data-en="COGS" data-zh="成本"></span>
              <span class="t" data-en="CAC" data-zh="获客"></span>
            </div>
            <div class="mini-grid"><strong>X1 Space</strong>
              <input id="spaceAsp" data-aria-en="X1 Space ASP" data-aria-zh="X1 Space 售价" type="number" min="0" step="10" />
              <input id="spaceCogs" data-aria-en="X1 Space COGS" data-aria-zh="X1 Space 成本" type="number" min="0" step="10" />
              <input id="spaceCac" data-aria-en="X1 Space CAC" data-aria-zh="X1 Space 获客成本" type="number" min="0" step="5" /></div>
            <div class="mini-grid"><strong>X1 Lab</strong>
              <input id="labAsp" data-aria-en="X1 Lab ASP" data-aria-zh="X1 Lab 售价" type="number" min="0" step="10" />
              <input id="labCogs" data-aria-en="X1 Lab COGS" data-aria-zh="X1 Lab 成本" type="number" min="0" step="10" />
              <input id="labCac" data-aria-en="X1 Lab CAC" data-aria-zh="X1 Lab 获客成本" type="number" min="0" step="5" /></div>
            <div class="mini-grid"><strong>Luya Y</strong>
              <input id="yAsp" data-aria-en="Luya Y ASP" data-aria-zh="Luya Y 售价" type="number" min="0" step="100" />
              <input id="yCogs" data-aria-en="Luya Y COGS" data-aria-zh="Luya Y 成本" type="number" min="0" step="100" />
              <input id="yCac" data-aria-en="Luya Y CAC" data-aria-zh="Luya Y 获客成本" type="number" min="0" step="50" /></div>
            <p class="input-note t" data-en="CAC is blended across every unit shipped, including organic and referral, and is held flat across all five years." data-zh="CAC 按全部出货量混合计算（含自然流量与推荐），五年保持不变。"></p>
            <label class="field"><span class="t" data-en="X1 Lab net price (% of ASP)" data-zh="X1 Lab 净价系数 (% 售价)"></span><input id="labNet" type="number" min="0" max="100" step="1" /></label>
            <label class="field"><span class="t" data-en="Luya Y net price (% of ASP)" data-zh="Luya Y 净价系数 (% 售价)"></span><input id="yNet" type="number" min="0" max="100" step="1" /></label>
            <label class="field"><span class="t" data-en="X1 Space extra net-price factor (%)" data-zh="X1 Space 附加净价系数 (%)"></span><input id="spaceNet" type="number" min="0" max="100" step="1" /></label>
            <div class="calculated-box"><span class="t" data-en="2030 blended Space net price" data-zh="2030 Space 加权净价"></span><strong id="spaceNetPreview">—</strong></div>
          </details>

          <details open>
            <summary class="t" data-en="Consumables plans" data-zh="耗材订阅"></summary>
            <div class="plan-inputs">
              <div><strong class="t" data-en="Standard" data-zh="标准"></strong><small class="t" data-en="8 trays / month" data-zh="每月 8 盘"></small></div>
              <label><span class="t" data-en="Price" data-zh="价格"></span><input id="standardPrice" type="number" min="0" step="1" /></label>
              <label><span class="t" data-en="COGS" data-zh="成本"></span><input id="standardCogs" type="number" min="0" step="1" /></label>
              <div><strong class="t" data-en="Power" data-zh="家庭"></strong><small class="t" data-en="16 trays / month" data-zh="每月 16 盘"></small></div>
              <label><span class="t" data-en="Price" data-zh="价格"></span><input id="powerPrice" type="number" min="0" step="1" /></label>
              <label><span class="t" data-en="COGS" data-zh="成本"></span><input id="powerCogs" type="number" min="0" step="1" /></label>
            </div>
          </details>

          <details>
            <summary class="t" data-en="Space subscription" data-zh="Space 订阅"></summary>
            <label class="field"><span class="t" data-en="Attach rate (%)" data-zh="订阅加入率 (%)"></span><input id="spaceAttach" type="number" min="0" max="100" step="1" /></label>
            <label class="field"><span class="t" data-en="Standard mix (%)" data-zh="标准套餐占比 (%)"></span><input id="spaceStandardMix" type="number" min="0" max="100" step="1" /></label>
            <div class="retention-grid headings"><span>3M</span><span>6M</span><span>12M</span></div>
            <div class="retention-grid">
              <input id="spaceRet3" data-aria-en="Space 3-month retention" data-aria-zh="Space 3个月留存" type="number" min="0" max="100" />
              <input id="spaceRet6" data-aria-en="Space 6-month retention" data-aria-zh="Space 6个月留存" type="number" min="0" max="100" />
              <input id="spaceRet12" data-aria-en="Space 12-month retention" data-aria-zh="Space 12个月留存" type="number" min="0" max="100" /></div>
          </details>

          <details>
            <summary class="t" data-en="Lab subscription" data-zh="Lab 订阅"></summary>
            <label class="field"><span class="t" data-en="Attach rate (%)" data-zh="订阅加入率 (%)"></span><input id="labAttach" type="number" min="0" max="100" step="1" /></label>
            <label class="field"><span class="t" data-en="Standard mix (%)" data-zh="标准套餐占比 (%)"></span><input id="labStandardMix" type="number" min="0" max="100" step="1" /></label>
            <div class="retention-grid headings"><span>3M</span><span>6M</span><span>12M</span></div>
            <div class="retention-grid">
              <input id="labRet3" data-aria-en="Lab 3-month retention" data-aria-zh="Lab 3个月留存" type="number" min="0" max="100" />
              <input id="labRet6" data-aria-en="Lab 6-month retention" data-aria-zh="Lab 6个月留存" type="number" min="0" max="100" />
              <input id="labRet12" data-aria-en="Lab 12-month retention" data-aria-zh="Lab 12个月留存" type="number" min="0" max="100" /></div>
          </details>

          <details>
            <summary class="t" data-en="China team &amp; opex" data-zh="中国团队与费用"></summary>
            <label class="field"><span class="t" data-en="China headcount" data-zh="中国团队人数"></span><input id="teamHeadcount" type="number" min="0" step="1" /></label>
            <label class="field"><span class="t" data-en="Average salary (RMB / mo)" data-zh="平均月薪 (RMB)"></span><input id="monthlySalaryRmb" type="number" min="0" step="1000" /></label>
            <label class="field"><span class="t" data-en="Office rent (RMB / mo)" data-zh="月租金 (RMB)"></span><input id="monthlyRentRmb" type="number" min="0" step="1000" /></label>
            <label class="field"><span class="t" data-en="Monthly spend cap (RMB)" data-zh="月支出上限 (RMB)"></span><input id="monthlySpendCapRmb" type="number" min="0" step="10000" /></label>
            <label class="field"><span class="t" data-en="RMB per USD" data-zh="人民币兑美元"></span><input id="usdCny" type="number" min="1" step="0.1" /></label>
            <label class="field"><span class="t" data-en="Team cost growth (%)" data-zh="团队成本增速 (%)"></span><input id="teamGrowth" type="number" min="0" max="100" step="1" /></label>
            <label class="field"><span class="t" data-en="R&amp;D (% revenue)" data-zh="研发费用 (% 营收)"></span><input id="rdPct" type="number" min="0" max="50" step="1" /></label>
            <label class="field"><span class="t" data-en="G&amp;A (% revenue)" data-zh="管理费用 (% 营收)"></span><input id="gaPct" type="number" min="0" max="50" step="1" /></label>
            <label class="field"><span class="t" data-en="Support cost / active sub ($)" data-zh="活跃订阅用户支持成本 ($)"></span><input id="supportCost" type="number" min="0" step="1" /></label>
            <div class="calculated-box"><span class="t" data-en="2026 annual team cost" data-zh="2026 年化团队成本"></span><strong id="teamCostPreview">$0</strong></div>
          </details>

          <details open>
            <summary class="t" data-en="Working capital, tax &amp; capex" data-zh="营运资金、税与资本开支"></summary>
            <label class="field"><span class="t" data-en="Inventory days" data-zh="库存周转天数"></span><input id="inventoryDays" type="number" min="0" step="5" /></label>
            <label class="field"><span class="t" data-en="Receivable days (DSO)" data-zh="应收账期 DSO (天)"></span><input id="dso" type="number" min="0" step="5" /></label>
            <label class="field"><span class="t" data-en="Payable days (DPO)" data-zh="应付账期 DPO (天)"></span><input id="dpo" type="number" min="0" step="5" /></label>
            <label class="field"><span class="t" data-en="Warranty &amp; returns (% hardware revenue)" data-zh="退货与保修 (% 硬件收入)"></span><input id="warrantyPct" type="number" min="0" max="20" step="0.5" /></label>
            <label class="field"><span class="t" data-en="Corporate tax rate (%)" data-zh="企业所得税率 (%)"></span><input id="taxRate" type="number" min="0" max="50" step="1" /></label>
            <p class="input-note t" data-en="Inventory is built against next year’s COGS, so a launch year funds the ramp before it sells it." data-zh="库存按下一年度 COGS 备货，因此放量前一年就要垫付这笔现金。"></p>
          </details>

          <details open>
            <summary class="t" data-en="Tooling &amp; capex by year" data-zh="逐年模具与资本开支"></summary>
            <label class="field"><span>2026 <span class="t" data-en="tooling (RMB)" data-zh="模具 (RMB)"></span></span><input id="capex2026" type="number" min="0" step="100000" /></label>
            <label class="field"><span>2027 <span class="t" data-en="tooling (RMB)" data-zh="模具 (RMB)"></span></span><input id="capex2027" type="number" min="0" step="100000" /></label>
            <label class="field"><span>2028 <span class="t" data-en="tooling (RMB)" data-zh="模具 (RMB)"></span></span><input id="capex2028" type="number" min="0" step="100000" /></label>
            <label class="field"><span>2029 <span class="t" data-en="tooling (RMB)" data-zh="模具 (RMB)"></span></span><input id="capex2029" type="number" min="0" step="100000" /></label>
            <label class="field"><span>2030 <span class="t" data-en="tooling (RMB)" data-zh="模具 (RMB)"></span></span><input id="capex2030" type="number" min="0" step="100000" /></label>
            <div class="calculated-box"><span class="t" data-en="5-year capex total" data-zh="五年资本开支合计"></span><strong id="capexPreview">—</strong></div>
            <p class="input-note t" data-en="Tooling is a step cost — one spend per mould, in the year it is cut. Entered per year rather than as a percentage of revenue. 2026 tools X1 Space, 2027 tools X1 Lab." data-zh="模具是阶梯式支出——一套模开一次，在开模当年一次性付清，因此按年填写而非按营收比例推算。2026 年为 X1 Space 开模，2027 年为 X1 Lab 开模。"></p>
          </details>
        </aside>

        <div class="dashboard">
          <section class="module validation-module" id="validation">
            <div class="module-heading">
              <div>
                <p class="section-kicker t" data-en="2026 · Validate" data-zh="2026 · 验证"></p>
                <h2 class="t" data-en="Validation &amp; pre-commercialization" data-zh="验证与商业化准备"></h2>
              </div>
              <span class="management-tag t" data-en="Management targets · Founder 100" data-zh="管理层目标 · Founder 100"></span>
            </div>
            <div class="validation-grid">
              <article data-def="val.reliability" tabindex="0"><span class="t" data-en="Product reliability" data-zh="产品可靠性"></span><strong>&gt;95%</strong></article>
              <article data-def="val.nps" tabindex="0"><span class="t" data-en="NPS" data-zh="净推荐值"></span><strong>&gt;50</strong></article>
              <article data-def="val.active" tabindex="0"><span class="t" data-en="Device active rate" data-zh="设备活跃率"></span><strong>&gt;70%</strong></article>
              <article data-def="val.ret3" tabindex="0"><span class="t" data-en="3-month retention" data-zh="3 个月留存率"></span><strong>&gt;85%</strong></article>
              <article data-def="val.trays" tabindex="0"><span class="t" data-en="Tray consumption" data-zh="托盘消耗量"></span><strong>8+ / mo</strong></article>
              <article data-def="val.attach" tabindex="0"><span class="t" data-en="Subscription attach" data-zh="订阅加入率"></span><strong>&gt;55%</strong></article>
              <article data-def="val.ugc" tabindex="0"><span class="t" data-en="UGC completion" data-zh="内容产出率"></span><strong>&gt;40%</strong></article>
              <article data-def="val.failure" tabindex="0"><span class="t" data-en="Failure rate" data-zh="故障率"></span><strong>&lt;5%</strong></article>
            </div>
            <p class="module-note" id="validationNote"></p>
          </section>

          <section class="module" id="executiveForecast">
            <div class="module-heading">
              <div>
                <p class="section-kicker t" data-en="1 · Executive forecast" data-zh="1 · 核心预测"></p>
